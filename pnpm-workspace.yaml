packages:
  - packages/plugins/vite/*
  - packages/plugins/vscode/*
  - packages/cdn/*
  - packages/config/*
  - packages/design-system/*
  - packages/apps/*
  - packages/apps/microfrontend/*
  - packages/poc/*

hoist: false
preferWorkspacePackages: true

publicHoistPattern:
  - '@storybook/react-vite'
allowBuilds:
  '@swc/core': true
  '@vscode/vsce-sign': true
  core-js: false
  esbuild: true
  keytar: false
