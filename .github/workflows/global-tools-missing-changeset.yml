name: Global:Tools:Missing-Changeset

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  validate-changesets:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 📦 Setup Node.js and pnpm
        uses: grasdouble/Lufa-CICD/actions/setup-node-pnpm@setup-node-pnpm-v1
        with:
          node-version-file: '.tool-versions'
          github-token: ${{ secrets.LUFA_CI_SECRET_READ }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Changeset coverage
        id: check-changesets
        uses: grasdouble/Lufa-CICD/actions/check-changesets@check-changesets-v1
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          ignore-markdown: 'false'

      - name: Post Changeset validation comment
        uses: grasdouble/Lufa-CICD/actions/pr-comment@pr-comment-v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-marker: '<!-- changeset-validation-comment -->'
          comment-body: ${{ steps.check-changesets.outputs.comment-body }}

      - name: Fail if Changesets are missing
        if: steps.check-changesets.outputs.missing-count > 0
        run: |
          echo "::error::Missing Changesets for ${{ steps.check-changesets.outputs.missing-count }} package(s)"
          echo "Please create Changesets for all modified packages by running: pnpm changeset"
          exit 1
