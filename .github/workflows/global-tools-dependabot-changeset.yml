name: Global:Tools:Dependabot:add-changeset

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  add-changeset:
    if: github.actor == 'dependabot[bot]' && github.head_ref != 'changeset-release/main'
    concurrency:
      group: dependabot-changeset-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 📦 Setup Node.js and pnpm
        uses: grasdouble/Lufa-CICD/actions/setup-node-pnpm@setup-node-pnpm-v1
        with:
          node-version-file: '.tool-versions'
          github-token: ${{ github.token }}

      - name: 📝 Generate, commit, and push Changeset
        uses: grasdouble/Lufa-CICD/actions/dependabot-changeset@dependabot-changeset-v1
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          head-branch: ${{ github.head_ref }}
          pull-request-number: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.LUFA_CI_SECRET_DEPENDABOT }}
