name: Validate AI Documentation

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - '.tool-versions'
      - 'packages/config/agents/AGENTS.shared.md'
      - 'scripts/validate-ai-docs.mjs'
      - 'scripts/validate-ai-docs.test.mjs'
      - 'scripts/validate-ai-docs.sh'
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - '.tool-versions'
      - 'packages/config/agents/AGENTS.shared.md'
      - 'scripts/validate-ai-docs.mjs'
      - 'scripts/validate-ai-docs.test.mjs'
      - 'scripts/validate-ai-docs.sh'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  validate:
    name: Validate Documentation Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      - name: Run validation script
        run: bash scripts/validate-ai-docs.sh

      - name: Report status
        if: failure()
        run: |
          echo "::error::AI documentation validation failed. Please fix the errors above."
          echo "Run 'pnpm validate:docs' locally to reproduce the errors."
          exit 1
