name: Validate AI Documentation

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - '.tool-versions'
      - 'packages/config/agents/AGENTS.shared.md'
      - 'scripts/validate-ai-docs.mjs'
      - 'scripts/validate-ai-docs.test.mjs'
      - 'scripts/validate-ai-docs.sh'
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - '.tool-versions'
      - 'packages/config/agents/AGENTS.shared.md'
      - 'scripts/validate-ai-docs.mjs'
      - 'scripts/validate-ai-docs.test.mjs'
      - 'scripts/validate-ai-docs.sh'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  validate:
    name: Validate Documentation Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .tool-versions

      - name: Run validation script
        run: bash scripts/validate-ai-docs.sh

      - name: Report status
        if: failure()
        run: |
          echo "::error::AI documentation validation failed. Please fix the errors above."
          echo "Run 'pnpm validate:docs' locally to reproduce the errors."
          exit 1
