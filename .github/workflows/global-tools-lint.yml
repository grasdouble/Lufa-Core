name: Global:Tools:Lint

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  actions: none
  checks: none
  deployments: none
  issues: none
  packages: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  Check-lint:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js and pnpm
        uses: grasdouble/Lufa-CICD/actions/setup-node-pnpm@setup-node-pnpm-v1
        with:
          node-version-file: '.tool-versions'
          github-token: ${{ secrets.LUFA_CI_SECRET_READ }}

      - name: 📦 Install dependencies
        id: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build packages
        id: build
        run: pnpm all:build

      - name: Run shared pnpm quality checks
        id: check-quality
        if: always() && steps.install-dependencies.outcome == 'success'
        uses: grasdouble/Lufa-CICD/actions/check-quality@check-quality-v2
        with:
          check-agent-rules: 'true'
          lint-command: pnpm all:lint
          typecheck-command: ${{ steps.build.outcome == 'success' && 'pnpm all:typecheck' || '' }}
          format-command: pnpm all:prettier:check

      - name: Run tests
        if: always() && steps.build.outcome == 'success'
        run: pnpm all:test

      - name: Validate Core documentation
        if: always() && steps.install-dependencies.outcome == 'success'
        run: pnpm validate:docs
