name: Dependency:Update
description: Update dependencies to their latest minor and patch versions and update an outdated dependencies report.

inputs:
  PAT_DEPENDENCY_CHECK_UPDATE:
    description: 'PAT with package read access and repository contents/pull-request write access; enables PR checks.'
    required: true
    default: ''
  SETUP_VERSION_FILE:
    description: 'File version to use during setup (package.json, .nvmrc, .node-version, .tool-versions).'
    required: false
    default: ''

outputs: {}

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ inputs.PAT_DEPENDENCY_CHECK_UPDATE }}
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false

    - name: Update .npmrc with authentication token
      shell: bash
      run: echo "//npm.pkg.github.com/:_authToken=${{ inputs.PAT_DEPENDENCY_CHECK_UPDATE }}" > ~/.npmrc

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: ${{ inputs.SETUP_VERSION_FILE }}
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Update dependencies (minor and patch versions only)
      shell: bash
      run: pnpm update -r

    - name: Sync shared agent rules into AGENTS.md
      shell: bash
      run: pnpm sync:agents

    - name: Update outdated dependencies report
      shell: bash
      run: pnpm exec node ${{ github.action_path }}/generateOutdatedReport.js

    - name: Add changeset coverage
      shell: bash
      run: node scripts/dependency-changeset.mjs

    - name: Validate updates
      shell: bash
      run: |
        pnpm all:build
        pnpm all:lint
        pnpm all:typecheck
        pnpm all:test
        pnpm all:prettier:check
        pnpm validate:docs
        pnpm changeset status

    - name: Create or update dependency PR
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ inputs.PAT_DEPENDENCY_CHECK_UPDATE }}
        branch: codex/automated-dependency-updates
        base: ${{ github.event.repository.default_branch }}
        title: 'chore: update dependencies'
        commit-message: 'chore: update dependencies'
        body: |
          Update dependencies and synchronize shared agent rules.
          Build, lint, type checking, tests, formatting and documentation checks passed before PR creation.
        add-paths: |
          package.json
          pnpm-lock.yaml
          packages/
          AGENTS.md
          .changeset/
          _docs/reports/OUTDATED_DEPENDENCIES.report

    - name: Generate summary
      shell: bash
      run: |
        cat ./_docs/reports/OUTDATED_DEPENDENCIES.report >> "$GITHUB_STEP_SUMMARY"
