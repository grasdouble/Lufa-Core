name: 'Design System:Build'
description: 'Build design system packages with intelligent caching'

inputs:
  build-storybook:
    description: 'Whether to build Storybook'
    required: false
    default: 'false'
  build-docusaurus:
    description: 'Whether to build Docusaurus'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Whether the design system build cache was hit'
    value: ${{ steps.cache-build.outputs.cache-hit }}
  storybook-cache-hit:
    description: 'Whether the Storybook build cache was hit'
    value: ${{ steps.cache-storybook.outputs.cache-hit }}
  docusaurus-cache-hit:
    description: 'Whether the Docusaurus build cache was hit'
    value: ${{ steps.cache-docusaurus.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: 📦 Cache design system build
      id: cache-build
      uses: actions/cache@v4
      with:
        path: |
          packages/design-system/tokens/dist
          packages/design-system/cli/dist
          packages/design-system/themes/dist
          packages/design-system/main/dist
        key: ds-build-${{ runner.os }}-${{ hashFiles('packages/design-system/tokens/**/*.json', 'packages/design-system/cli/src/**/*', 'packages/design-system/themes/src/**/*', 'packages/design-system/main/src/**/*', 'packages/design-system/*/package.json') }}
        restore-keys: |
          ds-build-${{ runner.os }}-

    - name: 🏗️ Build design tokens
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm ds:tokens:build

    - name: 🏗️ Build design cli
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm ds:cli:build

    # pnpm creates workspace bin symlinks during `pnpm install`, before any build runs.
    # At that point cli/dist/cli.js does not exist yet, so pnpm emits a WARN and skips
    # the symlink — leaving `lufa-ds-cli` unavailable for packages that depend on it (e.g. themes).
    # In pnpm v11+, re-running install says "Already up to date" and does NOT recreate missing
    # bin symlinks. We therefore create them directly after the CLI dist is built/restored.
    - name: 🔗 Refresh CLI bins
      shell: bash
      run: |
        CLI_JS="$(pwd)/packages/design-system/cli/dist/cli.js"
        chmod +x "$CLI_JS"
        # Recreate bin symlinks for every package that declares @grasdouble/lufa_design-system-cli
        # as a dependency (pnpm may have skipped them when dist/cli.js was absent).
        for pkg_json in $(find packages -name 'package.json' -not -path '*/node_modules/*'); do
          if grep -q '"@grasdouble/lufa_design-system-cli"' "$pkg_json"; then
            pkg_dir="$(dirname "$pkg_json")"
            mkdir -p "$pkg_dir/node_modules/.bin"
            ln -sf "$CLI_JS" "$pkg_dir/node_modules/.bin/lufa-ds-cli"
            echo "✔ linked lufa-ds-cli for $pkg_dir"
          fi
        done
        # Also ensure the workspace-root bin is present
        ln -sf "$CLI_JS" node_modules/.bin/lufa-ds-cli
        echo "✔ linked lufa-ds-cli in root node_modules/.bin"

    - name: 🏗️ Build design themes
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm ds:themes:build

    - name: 🏗️ Build design system main
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm ds:main:build

    - name: 📦 Cache Storybook build
      if: inputs.build-storybook == 'true'
      id: cache-storybook
      uses: actions/cache@v4
      with:
        path: packages/design-system/storybook/storybook-static
        key: storybook-build-${{ runner.os }}-${{ hashFiles('packages/design-system/storybook/**/*', 'packages/design-system/main/dist/**/*') }}
        restore-keys: |
          storybook-build-${{ runner.os }}-

    - name: 🏗️ Build Storybook
      if: inputs.build-storybook == 'true' && steps.cache-storybook.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm ds:storybook:build

    - name: 📦 Cache Docusaurus build
      if: inputs.build-docusaurus == 'true'
      id: cache-docusaurus
      uses: actions/cache@v4
      with:
        path: packages/design-system/docusaurus/build
        key: docusaurus-build-${{ runner.os }}-${{ hashFiles('packages/design-system/docusaurus/**/*', 'packages/design-system/main/dist/**/*') }}
        restore-keys: |
          docusaurus-build-${{ runner.os }}-

    - name: 🏗️ Build Docusaurus
      if: inputs.build-docusaurus == 'true' && steps.cache-docusaurus.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm ds:docusaurus:build
